<!DOCTYPE html>

      <div class="content">
    <h2>Contact Kickie Developer</h2>
    <p>Want to hire me or collaborate? Fill in the form below.</p>
    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Enter Your Full name">
      <br><br>
      <label>Email address</label>
      <input type="email" placeholder="eg kickiedeveloper@gmail.com">
      <br><br>
      <label>Phone number</label>
      <input type="number" placeholder="+254712345678">
      <br><br>
      <label>Subject</label>
      <input type="text" placeholder="eg Freelance project enquiry">
      <br><br>
      <label>Type of work</label>
      <input type="checkbox"> Website design<br>
      <input type="checkbox"> Web application<br>
      <input type="checkbox"> Backend API<br>
      <input type="checkbox"> Other
      <br><br>
      <label>Budget (KES)</label><br>
      <input type="number" placeholder="eg 1500">
      <br><br>
      <label>Your message</label>
      <textarea rows="6" cols="40" placeholder="describe your project here.."></textarea>
      <br><br>
      <button>Send message</button>
    </form>
